<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA+ — Household Battery Life Manager</title>
    <meta
      name="description"
      content="가정 내 배터리 기반 전자제품의 소비량을 분석해 남은 사용 가능 기간을 일수로 예측하는 스마트 배터리 수명 관리 서비스"
    />
    <meta property="og:title" content="AA+ — Household Battery Life Manager" />
    <meta
      property="og:description"
      content="가정 내 배터리 기반 전자제품의 소비량을 분석해 남은 사용 가능 기간을 일수로 예측하는 스마트 배터리 수명 관리 서비스"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #f8fafc;
        --bg-surface: #ffffff;
        --bg-subtle: #f1f5f9;
        --border-hairline: #e2e8f0;
        --border-strong: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-dark: #0f172a;
        --accent-blue: #2563eb;
        --accent-blue-hover: #1d4ed8;
        --status-green: #15803d;
        --status-amber: #b45309;
        --status-amber-bg: #fffbeb;
        --status-amber-border: #fde68a;
        --status-red: #b91c1c;
        --status-red-bg: #fef2f2;
        --status-red-border: #fecaca;
        --status-emerald-bg: #ecfdf5;
        --status-emerald-border: #a7f3d0;
        --font-display: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
        --font-sans: 'DM Sans', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius-lg: 12px;
        --radius-md: 8px;
        --radius-sm: 6px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        font-family: var(--font-sans);
        background: var(--bg-canvas);
        color: var(--text-primary);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
      }

      /* Top Bar (Strict 3-zone layout) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-hairline);
      }

      .topbar-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .brand {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .nav-links a {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 150ms ease;
      }

      .nav-links a:hover {
        color: var(--text-primary);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 600;
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
        text-decoration: none;
      }

      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent-blue);
        outline-offset: 2px;
      }

      .btn-dark {
        background: var(--accent-dark);
        color: #ffffff;
      }

      .btn-dark:hover {
        background: #1e293b;
      }

      .btn-blue {
        background: var(--accent-blue);
        color: #ffffff;
      }

      .btn-blue:hover {
        background: var(--accent-blue-hover);
      }

      .btn-subtle {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      .btn-subtle:hover {
        background: #e2e8f0;
      }

      .btn-outline {
        background: var(--bg-surface);
        border-color: var(--border-hairline);
        color: var(--text-secondary);
      }

      .btn-outline:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      .btn-danger {
        background: #dc2626;
        color: #ffffff;
      }

      .btn-danger:hover {
        background: #b91c1c;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }

      /* Main Layout */
      main {
        flex: 1;
        max-width: 1120px;
        width: 100%;
        margin: 0 auto;
        padding: 40px 20px 64px;
        display: flex;
        flex-direction: column;
        gap: 64px;
      }

      section {
        scroll-margin-top: 84px;
      }

      .section-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .section-subtitle {
        margin-top: 4px;
        font-size: 14px;
        color: var(--text-muted);
      }

      /* Controls Row */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .search-box {
        position: relative;
      }

      .search-box svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }

      .input,
      .select {
        width: 100%;
        padding: 9px 12px;
        font-size: 14px;
        color: var(--text-primary);
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
      }

      .search-box .input {
        padding-left: 34px;
        width: 220px;
      }

      .segmented {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--bg-subtle);
        border-radius: var(--radius-md);
        overflow-x: auto;
        max-width: 100%;
      }

      .seg-btn {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .seg-btn.active {
        background: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      /* Device Cards Grid */
      .device-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .device-card {
        display: flex;
        flex-direction: column;
        text-align: left;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        overflow: hidden;
        padding: 0;
        cursor: pointer;
        transition: border-color 150ms ease, transform 150ms ease;
      }

      .device-card:hover {
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      .device-thumb {
        aspect-ratio: 4 / 3;
        width: 100%;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 16px;
      }

      .device-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px;
      }

      .device-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        flex: 1;
        width: 100%;
      }

      .meta-line {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-title {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-life-row {
        padding-top: 12px;
        border-top: 1px solid #f1f5f9;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .device-life-label {
        font-size: 12px;
        color: var(--text-muted);
      }

      .device-life-value {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-primary);
      }

      /* Surface Box */
      .panel {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 24px;
      }

      .empty-box {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 40px 24px;
        text-align: center;
      }

      /* Registration Mode Cards (2 Clean Buttons) */
      .entry-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .entry-card {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        text-align: left;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 24px;
        cursor: pointer;
        transition: border-color 150ms ease;
      }

      .entry-card:hover {
        border-color: #94a3b8;
      }

      .entry-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        background: var(--bg-subtle);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .entry-card:hover .entry-icon {
        background: var(--accent-dark);
        color: #ffffff;
      }

      .entry-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .entry-desc {
        margin-top: 4px;
        font-size: 14px;
        color: var(--text-muted);
      }

      /* Sequential Wizard Header */
      .wizard-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 16px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 20px;
      }

      .step-pills {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .step-item {
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        border: none;
        background: transparent;
        color: #94a3b8;
      }

      .step-item.active {
        background: var(--accent-dark);
        color: #ffffff;
      }

      .step-item.done {
        background: var(--bg-subtle);
        color: var(--text-primary);
        cursor: pointer;
      }

      /* Form Grids */
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .field-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .unknown-btn {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid var(--border-hairline);
        background: #ffffff;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .unknown-btn.active {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
        color: #ffffff;
      }

      .candidate-card {
        text-align: left;
        padding: 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-hairline);
        background: #ffffff;
        cursor: pointer;
        transition: border-color 150ms ease;
      }

      .candidate-card.selected {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 1px var(--accent-blue);
      }

      .subpanel {
        background: #f8fafc;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 18px;
      }

      /* Banners */
      .banner {
        border-radius: var(--radius-md);
        padding: 12px 16px;
        font-size: 13px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .banner-success {
        background: var(--status-emerald-bg);
        border: 1px solid var(--status-emerald-border);
        color: #065f46;
      }

      .banner-warning {
        background: var(--status-amber-bg);
        border: 1px solid var(--status-amber-border);
        color: #78350f;
      }

      .banner-error {
        background: var(--status-red-bg);
        border: 1px solid var(--status-red-border);
        color: #991b1b;
      }

      /* Dashboard */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .kpi-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 20px;
      }

      .kpi-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .kpi-value {
        margin-top: 6px;
        font-size: 30px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .dash-split {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
      }

      .bar-row {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        padding: 12px 8px;
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        border-radius: 6px;
      }

      .bar-row:last-child {
        border-bottom: none;
      }

      .bar-row:hover {
        background: #f8fafc;
      }

      .bar-track {
        height: 8px;
        width: 100%;
        background: var(--bg-subtle);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 250ms ease;
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(15, 23, 42, 0.42);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .modal-backdrop.hidden {
        display: none;
      }

      .modal-dialog {
        background: #ffffff;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 680px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
      }

      .modal-header {
        position: sticky;
        top: 0;
        background: #ffffff;
        border-bottom: 1px solid var(--border-hairline);
        padding: 16px 24px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        z-index: 2;
      }

      .modal-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .spec-table {
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .spec-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 16px;
        font-size: 13px;
        border-bottom: 1px solid #f1f5f9;
      }

      .spec-row:last-child {
        border-bottom: none;
      }

      footer {
        background: var(--bg-surface);
        border-top: 1px solid var(--border-hairline);
        padding: 20px;
      }

      .footer-inner {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: var(--text-muted);
      }

      @media (max-width: 900px) {
        .device-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid-4,
        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dash-split {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .nav-links {
          display: none;
        }
        .device-grid,
        .entry-grid,
        .grid-4,
        .grid-3,
        .grid-2,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
        .search-box .input {
          width: 100%;
        }
      }
    </style>
  <script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
  <body>
    <!-- Top Bar: Strictly 3 zones -->
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#my-devices" class="brand">AA+</a>

        <nav class="nav-links" aria-label="주요 섹션 이동">
          <a href="#my-devices">내 제품</a>
          <a href="#register-device">제품 등록</a>
          <a href="#dashboard">대시보드</a>
        </nav>

        <a href="#register-device" class="btn btn-dark btn-sm">새 제품 등록</a>
      </div>
    </header>

    <main>
      <!-- 1. 내 제품 -->
      <section id="my-devices">
        <div class="section-header">
          <div>
            <h1 class="section-title">내 제품</h1>
            <p class="section-subtitle">
              등록된 제품의 남은 배터리 사용 기간을 확인하고 세부 정보를 관리하세요.
            </p>
          </div>

          <div class="toolbar">
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                id="device-search-input"
                type="search"
                class="input"
                placeholder="제품명·모델명 검색"
                aria-label="등록된 제품 검색"
              />
            </div>

            <div class="segmented" role="tablist" aria-label="배터리 규격 필터">
              <button type="button" class="seg-btn active" data-filter="all">전체</button>
              <button type="button" class="seg-btn" data-filter="AA">AA</button>
              <button type="button" class="seg-btn" data-filter="AAA">AAA</button>
              <button type="button" class="seg-btn" data-filter="COIN">코인셀</button>
              <button type="button" class="seg-btn" data-filter="OTHER">C·D·9V·기타</button>
            </div>
          </div>
        </div>

        <div id="devices-container"></div>
      </section>

      <!-- 2. 제품 등록 (초기 2개 버튼 -> 순차 3단계) -->
      <section id="register-device">
        <div class="section-header">
          <div>
            <h2 class="section-title">제품 등록</h2>
            <p class="section-subtitle">
              원하는 등록 방식을 선택하면 단계별로 제품 사양과 사용 환경을 간편하게 입력할 수 있습니다.
            </p>
          </div>
        </div>

        <div id="register-feedback" style="margin-bottom: 16px;"></div>
        <div id="register-container"></div>
      </section>

      <!-- 3. 대시보드 -->
      <section id="dashboard">

        function getTodayIsoDate() {
          var now = new Date();
          var y = now.getFullYear();
          var m = String(now.getMonth() + 1).padStart(2, '0');
          var d = String(now.getDate()).padStart(2, '0');
          return y + '-' + m + '-' + d;
        }

        function addDaysIso(baseIso, deltaDays) {
          var parsed = new Date(baseIso + 'T00:00:00');
          if (isNaN(parsed.getTime())) return getTodayIsoDate();
          parsed.setDate(parsed.getDate() + deltaDays);
          var y = parsed.getFullYear();
          var m = String(parsed.getMonth() + 1).padStart(2, '0');
          var d = String(parsed.getDate()).padStart(2, '0');
          return y + '-' + m + '-' + d;
        }

        function daysBetween(startIso, endIso) {
          var s = new Date(String(startIso).slice(0, 10) + 'T00:00:00');
          var e = new Date(String(endIso).slice(0, 10) + 'T00:00:00');
          if (isNaN(s.getTime()) || isNaN(e.getTime())) return 0;
          return Math.max(0, Math.floor((e.getTime() - s.getTime()) / 86400000));
        }

        function calculateBatteryPrediction(input) {
          var table = BATTERY_CAPACITY_MAH[input.batteryType] || BATTERY_CAPACITY_MAH.OTHER;
          var perCellMah = table[input.batteryChemistry] || BATTERY_CAPACITY_MAH.OTHER.alkaline;
          var count = Math.max(1, Math.min(24, Math.round(Number(input.batteryCount) || 1)));
          var effectiveMultiplier = count === 1 ? 1 : 1 + (count - 1) * 0.72;
          var effectiveCapacityMah = Math.round(perCellMah * effectiveMultiplier);

          var baseline = CATEGORY_BASELINES[input.category] || CATEGORY_BASELINES.other;
          var intensityMul = INTENSITY_MULTIPLIER[input.intensity] || 1.0;
          var safeHours = Math.max(0, Math.min(24, Number(input.dailyHours) || 0));
          var safeCount = Math.max(0, Math.min(10000, Number(input.dailyCount) || 0));

          var baseDailyMah;
          var stdDays = Number(input.standardLifeDays);
          if (stdDays && stdDays > 0) {
            var mfgDailyMah = effectiveCapacityMah / stdDays;
            if (input.consumptionProfile === 'constant_low') {
              baseDailyMah = mfgDailyMah * (0.88 + 0.12 * intensityMul);
            } else if (input.consumptionProfile === 'active_duty') {
              var hourRatio = baseline.refHours > 0 ? safeHours / baseline.refHours : 1;
              var clampedHourRatio = Math.max(0.15, Math.min(4.5, hourRatio));
              baseDailyMah = mfgDailyMah * (0.12 + 0.88 * clampedHourRatio * intensityMul);
            } else {
              var countRatio = baseline.refCount > 0 ? safeCount / baseline.refCount : 1;
              var hRatio = baseline.refHours > 0 ? safeHours / baseline.refHours : 1;

            if (input.consumptionProfile === 'constant_low') {
              baseDailyMah = baseline.standbyMa * 24 * (0.9 + 0.1 * intensityMul);
            } else if (input.consumptionProfile === 'active_duty') {
              baseDailyMah =
                baseline.activeMa * safeHours * intensityMul +
                baseline.standbyMa * Math.max(0, 24 - safeHours);
            } else {
              baseDailyMah =
                baseline.eventMah * safeCount * intensityMul +
                baseline.activeMa * Math.min(safeHours, 6) * 0.35 * intensityMul +
                baseline.standbyMa * 24;
            }
          }

          var calFactor = Math.max(0.25, Math.min(4.0, Number(input.calibrationFactor) || 1.0));
          var estimatedDailyMah = Number(Math.max(0.5, baseDailyMah * calFactor).toFixed(2));
          var predictedTotalDays = Math.max(
            1,
            Math.min(3650, Math.round(effectiveCapacityMah / estimatedDailyMah)),
          );

          var unknownCount = (input.unknownFields && input.unknownFields.length) || 0;
          var confidence = 'medium';
          if (input.hasReplacementHistory || (stdDays > 0 && unknownCount <= 1)) {
            confidence = 'high';
          } else if (!(stdDays > 0) && unknownCount >= 2) {
            confidence = 'low';
          }

          return {
            effectiveCapacityMah: effectiveCapacityMah,
            estimatedDailyMah: estimatedDailyMah,
            predictedTotalDays: predictedTotalDays,
            confidence: confidence,
          };
        }

        function getRemainingDays(device) {
          var elapsed = daysBetween(device.lastReplacedAt, getTodayIsoDate());
          return Math.max(0, Math.round(device.predictedTotalDays - elapsed));
        }

        function getBatteryStatus(remainingDays) {
          if (remainingDays <= 0) return 'critical';
          if (remainingDays <= 10) return 'warning';
          return 'normal';
        }

        function recalibrateFromReplacement(previousPredictedDays, actualDaysLasted, currentFactor) {
          var safePredicted = Math.max(1, previousPredictedDays);
          var safeActual = Math.max(1, actualDaysLasted);
          var implied = (safePredicted / safeActual) * currentFactor;
          var clamped = Math.max(0.3, Math.min(3.5, implied));
          var updated = 0.55 * currentFactor + 0.45 * clamped;
          return Number(Math.max(0.25, Math.min(4.0, updated)).toFixed(3));
        }

        // ============================================================
        // 5. Smart Local Product Identification & Photo Helper
        // ============================================================
        function identifyByQuery(queryText) {
          var q = String(queryText || '').trim().toLowerCase();
          var tokens = q.split(/\s+/).filter(Boolean);

          var scored = PRODUCT_CATALOG.map(function (item) {
            var score = 0;
            var fullText = (
              item.name +
              ' ' +
              item.manufacturer +
              ' ' +
              item.modelNumber +
              ' ' +
              item.keywords.join(' ') +
              ' ' +
              item.batteryType
            ).toLowerCase();

            tokens.forEach(function (tok) {
              if (fullText.indexOf(tok) !== -1) score += 2;
              if (item.modelNumber.toLowerCase().indexOf(tok) !== -1) score += 3;
            });
            return { item: item, score: score };
          })
            .filter(function (entry) {
              return entry.score > 0;
            })
            .sort(function (a, b) {
              return b.score - a.score;
            });

          if (scored.length > 0) {
            var topCandidates = scored.slice(0, 3).map(function (s) {
              return s.item;
            });
            var ambiguous = topCandidates.length > 1 && scored[0].score === scored[1].score;
            return {
              needsConfirmation: ambiguous || topCandidates.length > 1,
              uncertaintyReason:
                topCandidates.length > 1
                  ? '유사한 모델이 여러 개 검색되었습니다. 가장 일치하는 항목을 선택해 주세요.'
                  : '',
              candidates: topCandidates,
            };
          }

          // Fallback intelligent guess based on category keywords
          var inferredCat = 'other';
          var inferredBattery = 'AA';
          var inferredCount = 2;
          var inferredProfile = 'active_duty';
          if (q.indexOf('시계') !== -1) {
            inferredCat = 'clock';
            inferredCount = 1;
            inferredProfile = 'constant_low';
          } else if (q.indexOf('조명') !== -1 || q.indexOf('스탠드') !== -1 || q.indexOf('등') !== -1) {
            inferredCat = 'lighting';
            inferredBattery = 'AAA';
            inferredCount = 3;
            inferredProfile = 'event_peak';
          } else if (q.indexOf('리모컨') !== -1) {
            inferredCat = 'remote';
            inferredBattery = 'AAA';
            inferredCount = 2;
            inferredProfile = 'event_peak';
          } else if (q.indexOf('코인') !== -1 || q.indexOf('2032') !== -1) {
            inferredCat = 'sensor';
            inferredBattery = 'CR2032';
            inferredCount = 1;
            inferredProfile = 'constant_low';
          } else if (q.indexOf('도어락') !== -1) {
            inferredCat = 'lock';
            inferredBattery = 'AA';
            inferredCount = 4;
            inferredProfile = 'event_peak';
          }

          var b = CATEGORY_BASELINES[inferredCat] || CATEGORY_BASELINES.other;
          return {
            needsConfirmation: true,
            uncertaintyReason: '정확한 제조사 모델 사양을 찾지 못해 일반 분류 기준으로 제안했습니다. 다음 단계에서 규격을 확인해 주세요.',
            candidates: [
              {
                name: queryText.trim(),
                manufacturer: '',
                modelNumber: '',
                category: inferredCat,
                batteryType: inferredBattery,
                batteryChemistry: inferredBattery === 'CR2032' ? 'lithium' : 'alkaline',
                batteryCount: inferredCount,
                consumptionProfile: inferredProfile,
                standardLifeDays: 0,
                recommendedDailyHours: b.recHours,
                recommendedDailyCount: b.recCount,
                recommendedIntensity: b.recIntensity,
                specSourceNote: '일반 제품군 평균 사양 기반 추정 (사용자 확인 필요)',
              },
            ],
          };
        }

              '" class="input tabular-nums" value="' +
              wiz.lastReplacedAt +
              '" />' +
              '</div>' +
              '</div>' +
              (wiz.rationale
                ? '<div style="font-size:12px;color:var(--text-secondary);background:#ffffff;border:1px solid var(--border-hairline);border-radius:8px;padding:8px 12px;"><strong>추천 안내:</strong> ' +
                  escapeHtml(wiz.rationale) +
                  '</div>'
                : '') +
              '</div>' +
              '<div style="padding-top:14px;border-top:1px solid #f1f5f9;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;">' +
              '<div style="display:flex;flex-wrap:wrap;gap:24px;font-size:12px;">' +
              '<div><span style="color:var(--text-muted);display:block;">예상 잔여 수명</span><strong id="live-rem-days" class="tabular-nums" style="font-size:20px;">' +
              liveRemaining +
              '일</strong></div>' +
              '<div><span style="color:var(--text-muted);display:block;">총 예상 수명</span><strong id="live-tot-days" class="tabular-nums" style="font-size:16px;">' +
              liveCalc.predictedTotalDays +
              '일</strong></div>' +
              '<div><span style="color:var(--text-muted);display:block;">일일 추정 소비량</span><strong id="live-daily-mah" class="tabular-nums" style="font-size:16px;">' +
              liveCalc.estimatedDailyMah +
              ' mAh/일</strong></div>' +
              '</div>' +
              '<div style="display:flex;gap:8px;">' +
              '<button type="button" id="wiz-back-2" class="btn btn-subtle">← 이전</button>' +
              '<button type="submit" class="btn btn-blue">제품 등록하기</button>' +
              '</div>' +
              '</div>' +
              '</form>';
          }

          container.innerHTML = '<div class="panel">' + stepHeader + bodyHtml + '</div>';
          bindWizardEvents();
        }

        function updateLivePreviewNumbers() {
          var liveCalc = calculateBatteryPrediction({
            category: wiz.category,
            batteryType: wiz.batteryType,
            batteryChemistry: wiz.batteryChemistry,
            batteryCount: wiz.batteryCount,
            consumptionProfile: wiz.consumptionProfile,
            standardLifeDays: wiz.standardLifeDays,
            dailyHours: wiz.dailyHours,
            dailyCount: wiz.dailyCount,
            intensity: wiz.intensity,
            calibrationFactor: 1.0,
            unknownFields: wiz.unknownFields,
            hasReplacementHistory: false,
          });
          var liveRemaining = Math.max(
            0,
            Math.round(liveCalc.predictedTotalDays - daysBetween(wiz.lastReplacedAt, getTodayIsoDate())),
          );
          var remEl = document.getElementById('live-rem-days');
          var totEl = document.getElementById('live-tot-days');
          var mahEl = document.getElementById('live-daily-mah');
          if (remEl) remEl.textContent = liveRemaining + '일';
          if (totEl) totEl.textContent = liveCalc.predictedTotalDays + '일';
          if (mahEl) mahEl.textContent = liveCalc.estimatedDailyMah + ' mAh/일';
        }

        function bindWizardEvents() {
          var backModeBtn = document.getElementById('wiz-back-mode');
          if (backModeBtn) {
            backModeBtn.addEventListener('click', function () {
              resetWizard(false);
              renderRegister();
            });
          }

          document.querySelectorAll('[data-jump-step]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var target = Number(btn.getAttribute('data-jump-step'));
              if (target < wiz.step) {
                wiz.step = target;
                renderRegister();
              }
            });
          });

          if (wiz.step === 1) {
            var searchInput = document.getElementById('wiz-search-input');
            var searchBtn = document.getElementById('wiz-search-btn');
            if (searchInput) {
              searchInput.addEventListener('input', function (e) {
                wiz.searchQuery = e.target.value;
              });
              searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  runSearchStep();
                }
              });
            }
            if (searchBtn) {
              searchBtn.addEventListener('click', runSearchStep);
            }
            document.querySelectorAll('.sample-query').forEach(function (btn) {
              btn.addEventListener('click', function () {
                wiz.searchQuery = btn.getAttribute('data-q');
                runSearchStep();
              });
            });

            var uploadBtn = document.getElementById('wiz-upload-btn');
            var fileInput = document.getElementById('wiz-photo-file');
            var cameraBtn = document.getElementById('wiz-camera-btn');
            var hintInput = document.getElementById('wiz-photo-hint');
            var captureBtn = document.getElementById('wiz-capture-btn');

            if (hintInput) {
              hintInput.addEventListener('input', function (e) {
                wiz.photoHint = e.target.value;
              });
            }
            if (uploadBtn && fileInput) {
              uploadBtn.addEventListener('click', function () {
                fileInput.click();
              });
              fileInput.addEventListener('change', function (e) {
                var file = e.target.files && e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function () {
                  wiz.photoPreview = String(reader.result || '');
                  wiz.aiError = '';
                  var res = identifyFromPhotoMeta(file.name, wiz.photoHint);
                  wiz.identification = res;
                  wiz.selectedCandidateIdx = 0;
                  if (res.candidates.length > 0) applyCandidateToWizard(res.candidates[0]);
                  renderRegister();
                };
                reader.readAsDataURL(file);
              });
            }
            if (cameraBtn) {
              cameraBtn.addEventListener('click', function () {
                if (wiz.cameraActive) {
                  stopCamera();
                  renderRegister();
                  return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                  wiz.aiError = '이 브라우저 환경에서는 카메라에 접근할 수 없습니다. 이미지 업로드를 이용해 주세요.';
                  renderRegister();
                  return;
                }
                navigator.mediaDevices
                  .getUserMedia({ video: { facingMode: 'environment' } })
                  .then(function (stream) {
                    wiz.cameraStream = stream;
                    wiz.cameraActive = true;
                    wiz.aiError = '';
                    renderRegister();
                    var video = document.getElementById('wiz-video');
                    if (video) video.srcObject = stream;
                  })
                  .catch(function () {
                    wiz.aiError = '카메라 권한이 거부되었거나 장치를 찾을 수 없습니다. 이미지 업로드를 이용해 주세요.';
                    renderRegister();
                  });
              });
            }
            if (captureBtn) {
              captureBtn.addEventListener('click', function () {
                var video = document.getElementById('wiz-video');
                if (!video) return;
                var canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                var ctx = canvas.getContext('2d');
                if (ctx) {
                  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                  wiz.photoPreview = canvas.toDataURL('image/jpeg', 0.85);
                }
                stopCamera();
                var res = identifyFromPhotoMeta('', wiz.photoHint);
                wiz.identification = res;
                wiz.selectedCandidateIdx = 0;
                if (res.candidates.length > 0) applyCandidateToWizard(res.candidates[0]);
                renderRegister();
              });
            }

            document.querySelectorAll('[data-cand-idx]').forEach(function (card) {
              card.addEventListener('click', function () {
                var idx = Number(card.getAttribute('data-cand-idx'));
                wiz.selectedCandidateIdx = idx;
                if (wiz.identification && wiz.identification.candidates[idx]) {
                  applyCandidateToWizard(wiz.identification.candidates[idx]);
                }
                renderRegister();
              });
            });

            var manualBtn = document.getElementById('wiz-manual-btn');
            if (manualBtn) {
              manualBtn.addEventListener('click', function () {
                if (!wiz.name && wiz.searchQuery.trim()) wiz.name = wiz.searchQuery.trim();
                wiz.step = 2;
                renderRegister();
              });
            }

            var toStep2Btn = document.getElementById('wiz-to-step2');
            if (toStep2Btn) {
              toStep2Btn.addEventListener('click', function () {
                wiz.step = 2;
                renderRegister();
              });
            }
          } else if (wiz.step === 2) {
            var bindVal = function (id, key, isNum) {
              var el = document.getElementById(id);
              if (!el) return;
              el.addEventListener('input', function (e) {
                wiz[key] = isNum ? Math.max(1, Math.min(24, Number(e.target.value) || 1)) : e.target.value;
              });
              el.addEventListener('change', function (e) {
                wiz[key] = isNum ? Math.max(1, Math.min(24, Number(e.target.value) || 1)) : e.target.value;
              });
            };
            bindVal('f-name', 'name');
            bindVal('f-mfg', 'manufacturer');
            bindVal('f-model', 'modelNumber');
            bindVal('f-cat', 'category');
            bindVal('f-btype', 'batteryType');
            bindVal('f-bcount', 'batteryCount', true);
            bindVal('f-chem', 'batteryChemistry');
            bindVal('f-profile', 'consumptionProfile');
            bindVal('f-stddays', 'standardLifeDays');

            document.getElementById('wiz-back-1').addEventListener('click', function () {
              wiz.formError = '';
              wiz.step = 1;
              renderRegister();
            });
            document.getElementById('wiz-to-step3').addEventListener('click', function () {
              if (!String(wiz.name || '').trim()) {
                wiz.formError = '제품명을 입력해 주세요.';
                renderRegister();
                return;
              }
              wiz.formError = '';
              wiz.step = 3;
              renderRegister();
            });
          } else if (wiz.step === 3) {
            var presetSelect = document.getElementById('wiz-preset-select');
            if (presetSelect) {
              presetSelect.addEventListener('change', function (e) {
                var pid = e.target.value;
                wiz.activePresetId = pid;
                var preset = getAllPresets().find(function (p) {
                  return p.id === pid;
                });
                if (preset) {
                  wiz.dailyHours = preset.dailyHours;
                  wiz.dailyCount = preset.dailyCount;
                  wiz.intensity = preset.intensity;
                  wiz.unknownFields = wiz.unknownFields.filter(function (f) {
                    return f !== 'dailyHours' && f !== 'dailyCount' && f !== 'intensity';
                  });
                  wiz.rationale = '"' + preset.name + '" 프리셋 패턴이 적용되었습니다.';
                }
                renderRegister();
              });
            }

            var delPresetBtn = document.getElementById('wiz-del-preset');
            if (delPresetBtn) {
              delPresetBtn.addEventListener('click', function () {
                store.customPresets = store.customPresets.filter(function (p) {
                  return p.id !== wiz.activePresetId;
                });
                wiz.activePresetId = '';
                saveState();
                renderRegister();
              });
            }

            document.getElementById('wiz-toggle-preset-save').addEventListener('click', function () {
              wiz.showPresetCreator = !wiz.showPresetCreator;
              renderRegister();
            });

            var newPresetInput = document.getElementById('wiz-new-preset-name');
            if (newPresetInput) {
              newPresetInput.addEventListener('input', function (e) {
                wiz.newPresetName = e.target.value;
              });
            }
            var savePresetBtn = document.getElementById('wiz-save-preset-btn');
            if (savePresetBtn) {
              savePresetBtn.addEventListener('click', function () {
                var trimmed = String(wiz.newPresetName || '').trim();
                if (!trimmed) return;
                var id = 'preset-' + Date.now();
                store.customPresets.unshift({
                  id: id,
                  name: trimmed,
                  dailyHours: wiz.dailyHours,
                  dailyCount: wiz.dailyCount,
                  intensity: wiz.intensity,
                  isBuiltIn: false,
                });
                wiz.activePresetId = id;
                wiz.newPresetName = '';
                wiz.showPresetCreator = false;
                wiz.presetNotice = '"' + trimmed + '" 프리셋이 저장되었습니다.';
                saveState();
                renderRegister();
              });
            }

            document.querySelectorAll('[data-unknown]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                var field = btn.getAttribute('data-unknown');
                var idx = wiz.unknownFields.indexOf(field);
                if (idx === -1) {
                  wiz.unknownFields.push(field);
                  if (field === 'lastReplacedAt') wiz.lastReplacedAt = getTodayIsoDate();
                } else {
                  wiz.unknownFields.splice(idx, 1);
                }
                renderRegister();
              });
            });

            document.getElementById('wiz-recommend-btn').addEventListener('click', function () {
              var base = CATEGORY_BASELINES[wiz.category] || CATEGORY_BASELINES.other;
              var applyAll = wiz.unknownFields.length === 0;
              if (applyAll || wiz.unknownFields.indexOf('dailyHours') !== -1) {
                wiz.dailyHours = base.recHours;
              }
              if (applyAll || wiz.unknownFields.indexOf('dailyCount') !== -1) {
                wiz.dailyCount = base.recCount;
              }
              if (applyAll || wiz.unknownFields.indexOf('intensity') !== -1) {
                wiz.intensity = base.recIntensity;
              }
              if (applyAll || wiz.unknownFields.indexOf('lastReplacedAt') !== -1) {
                wiz.lastReplacedAt = getTodayIsoDate();
              }
              wiz.rationale = base.rationale;
              renderRegister();
            });

            document.getElementById('f-hours').addEventListener('input', function (e) {
              wiz.dailyHours = Math.max(0, Math.min(24, Number(e.target.value) || 0));
              wiz.unknownFields = wiz.unknownFields.filter(function (f) {
                return f !== 'dailyHours';
              });
              updateLivePreviewNumbers();
            });

            document.getElementById('f-count').addEventListener('input', function (e) {
              wiz.dailyCount = Math.max(0, Math.min(10000, Number(e.target.value) || 0));
              wiz.unknownFields = wiz.unknownFields.filter(function (f) {
                return f !== 'dailyCount';
              });
              updateLivePreviewNumbers();
            });

            document.querySelectorAll('[data-intensity]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                wiz.intensity = btn.getAttribute('data-intensity');
                wiz.unknownFields = wiz.unknownFields.filter(function (f) {
                  return f !== 'intensity';
                });
                renderRegister();
              });
            });

            document.getElementById('f-replaced').addEventListener('change', function (e) {
              wiz.lastReplacedAt = e.target.value || getTodayIsoDate();
              wiz.unknownFields = wiz.unknownFields.filter(function (f) {
                return f !== 'lastReplacedAt';
              });
              updateLivePreviewNumbers();
            });

            document.getElementById('wiz-back-2').addEventListener('click', function () {
              wiz.step = 2;
              renderRegister();
            });

            document.getElementById('wiz-step3-form').addEventListener('submit', function (e) {
              e.preventDefault();
              var calc = calculateBatteryPrediction({
                category: wiz.category,
                batteryType: wiz.batteryType,
                batteryChemistry: wiz.batteryChemistry,
                batteryCount: wiz.batteryCount,
                consumptionProfile: wiz.consumptionProfile,
                standardLifeDays: wiz.standardLifeDays,
                dailyHours: wiz.dailyHours,
                dailyCount: wiz.dailyCount,
                intensity: wiz.intensity,
                calibrationFactor: 1.0,
                unknownFields: wiz.unknownFields,
                hasReplacementHistory: false,
              });

              var newDev = {
                id: 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                name: String(wiz.name).trim(),
                manufacturer: String(wiz.manufacturer || '').trim(),
                modelNumber: String(wiz.modelNumber || '').trim(),
                category: wiz.category,
                photoDataUrl: wiz.photoPreview || '',
                batteryType: wiz.batteryType,
                batteryChemistry: wiz.batteryChemistry,
                batteryCount: wiz.batteryCount,
                consumptionProfile: wiz.consumptionProfile,
                standardLifeDays: Number(wiz.standardLifeDays) > 0 ? Number(wiz.standardLifeDays) : null,
                specSourceNote: wiz.specSourceNote,
                dailyHours: wiz.dailyHours,
                dailyCount: wiz.dailyCount,
                intensity: wiz.intensity,
                unknownFields: wiz.unknownFields.slice(),
                lastReplacedAt: wiz.lastReplacedAt,
                calibrationFactor: 1.0,
                predictedTotalDays: calc.predictedTotalDays,
                estimatedDailyMah: calc.estimatedDailyMah,
                confidence: calc.confidence,
              };

              store.devices.unshift(newDev);
              saveState();
              var rem = getRemainingDays(newDev);
              resetWizard(false);
              wiz.feedbackBanner =
                '"' + newDev.name + '" 등록 완료 — 예상 잔여 수명 ' + rem + '일로 내 제품에 반영되었습니다.';
              renderDevices();
              renderRegister();
              renderDashboard();
            });
          }
        }

        function runSearchStep() {
          var q = String(wiz.searchQuery || '').trim();
          if (!q) {
            wiz.aiError = '제품명, 제조사 또는 모델명을 입력해 주세요.';
            renderRegister();
            return;
          }
          wiz.aiError = '';
          var res = identifyByQuery(q);
          wiz.identification = res;
          wiz.selectedCandidateIdx = 0;
          if (res.candidates.length > 0) applyCandidateToWizard(res.candidates[0]);
          renderRegister();
        }

        // ---- Render Section 3: 대시보드 ----
        function renderDashboard() {
          var container = document.getElementById('dashboard-container');
          var devices = store.devices;
          var total = devices.length;
          var sumRem = 0;
          var lowCount = 0;
          var totalMah = 0;
          var byBat = {};

          var items = devices
            .map(function (d) {
              var rem = getRemainingDays(d);
              sumRem += rem;
              if (rem <= 10) lowCount += 1;
              totalMah += Number(d.estimatedDailyMah) || 0;
              if (!byBat[d.batteryType]) byBat[d.batteryType] = { devices: 0, cells: 0 };
              byBat[d.batteryType].devices += 1;
              byBat[d.batteryType].cells += Number(d.batteryCount) || 1;
              return { device: d, remaining: rem };
            })
            .sort(function (a, b) {
              return a.remaining - b.remaining;
            });

          var avgDays = total > 0 ? Math.floor(sumRem / total) : 0;
          var maxBar = items.reduce(function (m, it) {
            return Math.max(m, it.remaining);
          }, 30);

          var kpiHtml =
            '<div class="kpi-grid">' +
            '<div class="kpi-card"><div class="kpi-label">등록된 제품</div><div class="kpi-value tabular-nums">' +
            total +
            '개</div></div>' +
            '<div class="kpi-card"><div class="kpi-label">평균 예상 잔여 수명</div><div class="kpi-value tabular-nums">' +
            avgDays +
            '일</div></div>' +
            '<div class="kpi-card"><div class="kpi-label">교체 임박 (10일 이하)</div><div class="kpi-value tabular-nums" style="color:' +
            (lowCount > 0 ? 'var(--status-amber)' : 'var(--text-primary)') +
            ';">' +
            lowCount +
            '개</div></div>' +
            '<div class="kpi-card"><div class="kpi-label">일일 총 추정 소비량</div><div class="kpi-value tabular-nums">' +
            totalMah.toFixed(1) +
            '<span style="font-size:13px;font-weight:500;color:var(--text-muted);margin-left:4px;">mAh/일</span></div></div>' +
            '</div>';

          if (total === 0) {
            container.innerHTML = kpiHtml;
            return;
          }

          var barsHtml = items
            .map(function (it) {
              var st = getBatteryStatus(it.remaining);
              var pct = Math.max(3, Math.min(100, Math.round((it.remaining / maxBar) * 100)));
              var fill = st === 'critical' ? '#dc2626' : st === 'warning' ? '#d97706' : '#0f172a';
              var stLabel = st === 'critical' ? '교체 필요' : st === 'warning' ? '교체 임박' : '정상';
              var stColor =
                st === 'critical'
                  ? 'var(--status-red)'
                  : st === 'warning'
                    ? 'var(--status-amber)'
                    : 'var(--status-green)';

              return (
                '<button type="button" class="bar-row" data-dash-dev="' +
                escapeHtml(it.device.id) +
                '">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;">' +
                '<div style="display:flex;align-items:center;gap:8px;min-width:0;">' +
                '<strong style="color:var(--text-primary);">' +
                escapeHtml(it.device.name) +
                '</strong>' +
                '<span style="font-size:12px;color:var(--text-muted);">' +
                escapeHtml(it.device.batteryType) +
                ' ' +
                it.device.batteryCount +
                '개</span>' +
                '</div>' +
                '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">' +
                '<span style="font-size:12px;font-weight:600;color:' +
                stColor +
                ';">' +
                stLabel +
                '</span>' +
                '<strong class="tabular-nums" style="width:54px;text-align:right;">' +
                it.remaining +
                '일</strong>' +
                '</div>' +
                '</div>' +
                '<div class="bar-track"><div class="bar-fill" style="width:' +
                pct +
                '%;background:' +
                fill +
                ';"></div></div>' +
                '</button>'
              );
            })
            .join('');

          var invHtml = Object.keys(byBat)
            .sort(function (a, b) {
              return byBat[b].cells - byBat[a].cells;
            })
            .map(function (bType) {
              var row = byBat[bType];
              return (
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">' +
                '<div><strong style="display:block;">' +
                escapeHtml(BATTERY_TYPE_LABELS[bType] || bType) +
                '</strong><span style="font-size:12px;color:var(--text-muted);">' +
                row.devices +
                '개 제품</span></div>' +
                '<strong class="tabular-nums">총 ' +
                row.cells +
                '개 장착</strong>' +
                '</div>'
              );
            })
            .join('');

          container.innerHTML =
            kpiHtml +
            '<div class="dash-split">' +
            '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="font-size:16px;font-weight:600;">제품별 잔여 수명 비교</h3><span style="font-size:12px;color:var(--text-muted);">잔여 일수 짧은 순</span></div>' +
            barsHtml +
            '</div>' +
            '<div class="panel"><h3 style="font-size:16px;font-weight:600;">사용 중인 배터리 규격 현황</h3><p style="font-size:12px;color:var(--text-muted);margin-top:4px;margin-bottom:10px;">가정 내 기기들이 요구하는 규격별 총 건전지 수입니다.</p>' +
            invHtml +
            '</div>' +
            '</div>';

          container.querySelectorAll('[data-dash-dev]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              openDeviceModal(btn.getAttribute('data-dash-dev'));
            });
          });
        }

        // ---- Modal: 제품 상세 · 교체 이력 · 수정 ----
        function openDeviceModal(deviceId) {
          selectedDeviceId = deviceId;
          modalTab = 'overview';
          confirmDeleteId = null;
          renderModal();
          document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDeviceModal() {
          selectedDeviceId = null;
          document.getElementById('detail-modal').classList.add('hidden');
        }

        function renderModal(feedbackText) {
          var dev = store.devices.find(function (d) {
            return d.id === selectedDeviceId;
          });
          if (!dev) {
            closeDeviceModal();
            return;
          }

          var rem = getRemainingDays(dev);
          var st = getBatteryStatus(rem);
          var devLogs = store.logs.filter(function (l) {
            return l.deviceId === dev.id;
          });

          document.getElementById('modal-meta').textContent =
            (dev.manufacturer || '미지정 제조사') + (dev.modelNumber ? ' · ' + dev.modelNumber : '');
          document.getElementById('modal-title').textContent = dev.name;

          var html = '';

          // 10일 이하 교체 임박 경고 (제품 상세 화면 전용)
          if (st !== 'normal') {
            html +=
              '<div class="banner ' +
              (st === 'critical' ? 'banner-error' : 'banner-warning') +
              '">' +
              '<div>' +
              '<strong style="display:block;">' +
              (st === 'critical'
                ? '배터리 교체가 필요합니다 (예상 수명 만료)'
                : '교체 임박 알림 — 예상 잔여 수명 ' + rem + '일 남음') +
              '</strong>' +
              '<span style="font-size:12px;">교체용 ' +
              escapeHtml(BATTERY_TYPE_LABELS[dev.batteryType] || dev.batteryType) +
              ' 건전지 ' +
              dev.batteryCount +
              '개를 준비해 주세요. 교체 후 아래에서 교체 기록을 남기면 다음 예측 정확도가 개선됩니다.</span>' +
              '</div>' +
              '</div>';
          }

          if (feedbackText) {
            html += '<div class="banner banner-success">' + escapeHtml(feedbackText) + '</div>';
          }

          html +=
            '<div class="segmented" style="width:fit-content;">' +
            '<button type="button" class="seg-btn ' +
            (modalTab === 'overview' ? 'active' : '') +
            '" data-mtab="overview">세부 정보 · 이력</button>' +
            '<button type="button" class="seg-btn ' +
            (modalTab === 'replace' ? 'active' : '') +
            '" data-mtab="replace">배터리 교체 기록</button>' +
            '<button type="button" class="seg-btn ' +
            (modalTab === 'edit' ? 'active' : '') +
            '" data-mtab="edit">사용 패턴 수정</button>' +
            '</div>';

          if (modalTab === 'overview') {
            var confLabel =
              dev.confidence === 'high' ? '높음' : dev.confidence === 'low' ? '낮음' : '보통';
            var remColor =
              st === 'critical'
                ? 'var(--status-red)'
                : st === 'warning'
                  ? 'var(--status-amber)'
                  : 'var(--text-primary)';

            html +=
              '<div class="grid-4">' +
              '<div class="kpi-card" style="padding:14px;"><div class="kpi-label">예상 잔여 수명</div><div class="tabular-nums" style="font-size:24px;font-weight:700;margin-top:4px;color:' +
              remColor +
              ';">' +
              rem +
              '일</div></div>' +
              '<div class="kpi-card" style="padding:14px;"><div class="kpi-label">하루 평균 소비량</div><div class="tabular-nums" style="font-size:18px;font-weight:700;margin-top:6px;">' +
              dev.estimatedDailyMah +
              ' <span style="font-size:12px;font-weight:400;color:var(--text-muted);">mAh</span></div></div>' +
              '<div class="kpi-card" style="padding:14px;"><div class="kpi-label">마지막 교체일</div><div class="tabular-nums" style="font-size:14px;font-weight:600;margin-top:8px;">' +
              escapeHtml(dev.lastReplacedAt) +
              '</div></div>' +
              '<div class="kpi-card" style="padding:14px;"><div class="kpi-label">예측 신뢰도</div><div style="font-size:14px;font-weight:600;margin-top:8px;">' +
              confLabel +
              ' <span class="tabular-nums" style="font-size:12px;color:var(--text-muted);">(×' +
              Number(dev.calibrationFactor || 1).toFixed(2) +
              ')</span></div></div>' +
              '</div>' +
              '<div class="spec-table">' +
              '<div class="spec-row"><span style="color:var(--text-muted);">배터리 규격 · 종류</span><strong>' +
              escapeHtml(BATTERY_TYPE_LABELS[dev.batteryType] || dev.batteryType) +
              ' × ' +
              dev.batteryCount +
              '개 (' +
              escapeHtml(CHEMISTRY_LABELS[dev.batteryChemistry] || dev.batteryChemistry) +
              ')</strong></div>' +
              '<div class="spec-row"><span style="color:var(--text-muted);">소비 특성 모델</span><strong>' +
              escapeHtml(PROFILE_LABELS[dev.consumptionProfile] || dev.consumptionProfile) +
              '</strong></div>' +
              '<div class="spec-row"><span style="color:var(--text-muted);">실제 사용 환경</span><strong class="tabular-nums">일 ' +
              dev.dailyHours +
              '시간 · ' +
              dev.dailyCount +
              '회 · 강도 ' +
              escapeHtml(INTENSITY_LABELS[dev.intensity] || dev.intensity) +
              '</strong></div>' +
              (dev.specSourceNote
                ? '<div class="spec-row"><span style="color:var(--text-muted);flex-shrink:0;">사양 근거</span><span style="text-align:right;color:var(--text-secondary);">' +
                  escapeHtml(dev.specSourceNote) +
                  '</span></div>'
                : '') +
              '</div>' +
              '<div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong style="font-size:14px;">배터리 교체 이력</strong><button type="button" id="m-go-replace" style="border:none;background:none;color:var(--accent-blue);font-size:12px;font-weight:600;cursor:pointer;">+ 새 교체 기록 추가</button></div>' +
              (devLogs.length === 0
                ? '<div style="border:1px dashed var(--border-hairline);border-radius:8px;padding:14px;font-size:12px;color:var(--text-muted);">아직 기록된 교체 이력이 없습니다. 배터리를 교체할 때 기록을 남기면 예측 정확도가 개선됩니다.</div>'
                : '<div class="spec-table">' +
                  devLogs
                    .map(function (l) {
                      return (
                        '<div class="spec-row">' +
                        '<div><strong class="tabular-nums">' +
                        escapeHtml(l.replacedAt) +
                        ' · ' +
                        escapeHtml(CHEMISTRY_LABELS[l.chemistryUsed] || l.chemistryUsed) +
                        '</strong>' +
                        (l.notes
                          ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">' +
                            escapeHtml(l.notes) +
                            '</div>'
                          : '') +
                        '</div>' +
                        '<div class="tabular-nums" style="text-align:right;"><strong>실사용 ' +
                        l.actualDaysLasted +
                        '일</strong><div style="font-size:11px;color:var(--text-muted);">기존 예측 ' +
                        l.previousPredictedDays +
                        '일</div></div>' +
                        '</div>'
                      );
                    })
                    .join('') +
                  '</div>') +
              '</div>' +
              '<div style="padding-top:14px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
              (confirmDeleteId === dev.id
                ? '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--status-red);font-weight:600;">정말 삭제할까요?</span><button type="button" id="m-del-confirm" class="btn btn-danger btn-sm">삭제 확인</button><button type="button" id="m-del-cancel" class="btn btn-subtle btn-sm">취소</button></div>'
                : '<button type="button" id="m-del-ask" class="btn btn-outline btn-sm">제품 삭제</button>') +
              '<button type="button" id="m-close-bottom" class="btn btn-subtle btn-sm">닫기</button>' +
              '</div>';
          } else if (modalTab === 'replace') {
            html +=
              '<form id="m-replace-form" style="display:flex;flex-direction:column;gap:14px;">' +
              '<p style="font-size:12px;color:var(--text-secondary);">직전 장착일(' +
              escapeHtml(dev.lastReplacedAt) +
              ')로부터 실제 버틴 일수를 계산하여 소비량 보정 계수를 자동 업데이트합니다.</p>' +
              '<div class="grid-2">' +
              '<label class="field"><span class="field-label">배터리 교체 날짜</span><input id="mr-date" type="date" required class="input tabular-nums" max="' +
              getTodayIsoDate() +
              '" value="' +
              getTodayIsoDate() +
              '" /></label>' +
              '<label class="field"><span class="field-label">새로 넣은 배터리 종류</span><select id="mr-chem" class="select">' +
              Object.keys(CHEMISTRY_LABELS)
                .map(function (k) {
                  return (
                    '<option value="' +
                    k +
                    '"' +
                    (dev.batteryChemistry === k ? ' selected' : '') +
                    '>' +
                    CHEMISTRY_LABELS[k] +
                    '</option>'
                  );
                })
                .join('') +
              '</select></label>' +
              '</div>' +
              '<label class="field"><span class="field-label">메모 (선택)</span><input id="mr-notes" type="text" maxlength="200" class="input" placeholder="예: 에너자이저 알카라인으로 교체" /></label>' +
              '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
              '<button type="button" id="mr-cancel" class="btn btn-subtle btn-sm">취소</button>' +
              '<button type="submit" class="btn btn-dark btn-sm">교체 기록 저장 및 예측 보정</button>' +
              '</div>' +
              '</form>';
          } else if (modalTab === 'edit') {
            html +=
              '<form id="m-edit-form" style="display:flex;flex-direction:column;gap:14px;">' +
              '<div class="grid-2">' +
              '<label class="field"><span class="field-label">하루 평균 사용 시간 (시간)</span><input id="me-hours" type="number" min="0" max="24" step="0.5" class="input tabular-nums" value="' +
              dev.dailyHours +
              '" /></label>' +
              '<label class="field"><span class="field-label">하루 사용 횟수 (회)</span><input id="me-count" type="number" min="0" max="10000" class="input tabular-nums" value="' +
              dev.dailyCount +
              '" /></label>' +
              '<label class="field"><span class="field-label">사용 강도</span><select id="me-intensity" class="select">' +
              ['low', 'medium', 'high']
                .map(function (lvl) {
                  return (
                    '<option value="' +
                    lvl +
                    '"' +
                    (dev.intensity === lvl ? ' selected' : '') +
                    '>' +
                    INTENSITY_LABELS[lvl] +
                    '</option>'
                  );
                })
                .join('') +
              '</select></label>' +
              '<label class="field"><span class="field-label">마지막 교체일</span><input id="me-replaced" type="date" max="' +
              getTodayIsoDate() +
              '" class="input tabular-nums" value="' +
              dev.lastReplacedAt +
              '" /></label>' +
              '</div>' +
              '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
              '<button type="button" id="me-cancel" class="btn btn-subtle btn-sm">취소</button>' +
              '<button type="submit" class="btn btn-dark btn-sm">변경사항 저장</button>' +
              '</div>' +
              '</form>';
          }

          var bodyEl = document.getElementById('modal-body');
          bodyEl.innerHTML = html;

          bodyEl.querySelectorAll('[data-mtab]').forEach(function (b) {
            b.addEventListener('click', function () {
              modalTab = b.getAttribute('data-mtab');
              renderModal();
            });
          });

          var goRep = document.getElementById('m-go-replace');
          if (goRep) {
            goRep.addEventListener('click', function () {
              modalTab = 'replace';
              renderModal();
            });
          }
          var closeBottom = document.getElementById('m-close-bottom');
          if (closeBottom) closeBottom.addEventListener('click', closeDeviceModal);

          var delAsk = document.getElementById('m-del-ask');
          if (delAsk) {
            delAsk.addEventListener('click', function () {
              confirmDeleteId = dev.id;
              renderModal();
            });
          }
          var delCancel = document.getElementById('m-del-cancel');
          if (delCancel) {
            delCancel.addEventListener('click', function () {
              confirmDeleteId = null;
              renderModal();
            });
          }
          var delConfirm = document.getElementById('m-del-confirm');
          if (delConfirm) {
            delConfirm.addEventListener('click', function () {
              store.devices = store.devices.filter(function (d) {
                return d.id !== dev.id;
              });
              store.logs = store.logs.filter(function (l) {
                return l.deviceId !== dev.id;
              });
              saveState();
              closeDeviceModal();
              renderDevices();
              renderDashboard();
            });
          }

          var repForm = document.getElementById('m-replace-form');
          if (repForm) {
            document.getElementById('mr-cancel').addEventListener('click', function () {
              modalTab = 'overview';
              renderModal();
            });
            repForm.addEventListener('submit', function (e) {
              e.preventDefault();
              var newDate = document.getElementById('mr-date').value || getTodayIsoDate();
              var newChem = document.getElementById('mr-chem').value;
              var notes = document.getElementById('mr-notes').value.trim();
              var actualDays = Math.max(1, daysBetween(dev.lastReplacedAt, newDate));
              var newCal = recalibrateFromReplacement(
                dev.predictedTotalDays,
                actualDays,
                dev.calibrationFactor || 1.0,
              );
              var recalc = calculateBatteryPrediction({
                category: dev.category,
                batteryType: dev.batteryType,
                batteryChemistry: newChem,
                batteryCount: dev.batteryCount,
                consumptionProfile: dev.consumptionProfile,
                standardLifeDays: dev.standardLifeDays,
                dailyHours: dev.dailyHours,
                dailyCount: dev.dailyCount,
                intensity: dev.intensity,
                calibrationFactor: newCal,
                unknownFields: dev.unknownFields,
                hasReplacementHistory: true,
              });

              store.logs.unshift({
                id: 'log-' + Date.now(),
                deviceId: dev.id,
                replacedAt: newDate,
                chemistryUsed: newChem,
                actualDaysLasted: actualDays,
                previousPredictedDays: dev.predictedTotalDays,
                notes: notes,
              });

              dev.batteryChemistry = newChem;
              dev.lastReplacedAt = newDate;
              dev.calibrationFactor = newCal;
              dev.predictedTotalDays = recalc.predictedTotalDays;
              dev.estimatedDailyMah = recalc.estimatedDailyMah;
              dev.confidence = recalc.confidence;

              saveState();
              modalTab = 'overview';
              renderModal('배터리 교체 기록이 저장되었으며 예측 보정 계수가 업데이트되었습니다.');
              renderDevices();
              renderDashboard();
            });
          }

          var editForm = document.getElementById('m-edit-form');
          if (editForm) {
            document.getElementById('me-cancel').addEventListener('click', function () {
              modalTab = 'overview';
              renderModal();
            });
            editForm.addEventListener('submit', function (e) {
              e.preventDefault();
              var hours = Math.max(0, Math.min(24, Number(document.getElementById('me-hours').value) || 0));
              var count = Math.max(0, Math.min(10000, Number(document.getElementById('me-count').value) || 0));
              var inten = document.getElementById('me-intensity').value;
              var replaced = document.getElementById('me-replaced').value || getTodayIsoDate();

              var recalc = calculateBatteryPrediction({
                category: dev.category,
                batteryType: dev.batteryType,
                batteryChemistry: dev.batteryChemistry,
                batteryCount: dev.batteryCount,
                consumptionProfile: dev.consumptionProfile,
                standardLifeDays: dev.standardLifeDays,
                dailyHours: hours,
                dailyCount: count,
                intensity: inten,
                calibrationFactor: dev.calibrationFactor,
                unknownFields: dev.unknownFields,
                hasReplacementHistory: devLogs.length > 0,
              });

              dev.dailyHours = hours;
              dev.dailyCount = count;
              dev.intensity = inten;
              dev.lastReplacedAt = replaced;
              dev.predictedTotalDays = recalc.predictedTotalDays;
              dev.estimatedDailyMah = recalc.estimatedDailyMah;
              dev.confidence = recalc.confidence;

              saveState();
              modalTab = 'overview';
              renderModal('사용 환경 설정과 예상 수명이 재계산되었습니다.');
              renderDevices();
              renderDashboard();
            });
          }
        }

        // ============================================================
        // 7. Global Event Wiring & Initial Boot
        // ============================================================
        document.getElementById('device-search-input').addEventListener('input', function (e) {
          searchFilter = e.target.value;
          renderDevices();
        });

        document.querySelectorAll('[data-filter]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            batteryFilter = btn.getAttribute('data-filter');
            document.querySelectorAll('[data-filter]').forEach(function (el) {
              el.classList.toggle('active', el === btn);
            });
            renderDevices();
          });
        });

        document.getElementById('modal-close-btn').addEventListener('click', closeDeviceModal);
        document.getElementById('detail-modal').addEventListener('click', function (e) {
          if (e.target === this) closeDeviceModal();
        });

        document.getElementById('reset-demo-btn').addEventListener('click', function () {
          store = createDefaultState();
          saveState();
          resetWizard(false);
          renderDevices();
          renderRegister();
          renderDashboard();
        });

        renderDevices();
        renderRegister();
        renderDashboard();
      })();
    </script>
  </body>
</html>
